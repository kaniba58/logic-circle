<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>異界陣ジェネレーター</title>
  <style>
    :root { color-scheme: dark; }

    body {
      margin: 0;
      background: #09080b;
      color: #f4eef2;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 18px 0 10px;
      letter-spacing: .08em;
    }

    .panel {
      width: min(1360px, 96%);
      margin: 0 auto 18px;
      padding: 16px;
      background: #17131a;
      border: 1px solid #3a2c35;
      border-radius: 14px;
      box-sizing: border-box;
    }

    .desc {
      font-size: 14px;
      line-height: 1.7;
      opacity: .92;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .group {
      min-width: 235px;
      padding: 12px;
      background: #241b24;
      border: 1px solid #45313f;
      border-radius: 12px;
      box-sizing: border-box;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      margin: 6px 0 4px;
    }

    input[type="text"],
    input[type="number"],
    input[type="color"],
    select,
    textarea {
      width: 92%;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      background: #0e0b10;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.45;
    }

    input[type="range"] {
      width: 92%;
      accent-color: #9d687f;
    }

    input[type="color"] {
      height: 42px;
      padding: 4px;
    }

    .valueRow {
      font-size: 12px;
      opacity: .86;
      margin-top: 2px;
      margin-bottom: 4px;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 9px;
      background: #7f546b;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin: 4px;
    }

    button:hover { opacity: .9; }

    #magicCanvas {
      display: block;
      width: 1100px;
      max-width: none;
      height: auto;
      background: transparent;
    }

    .legend {
      display: inline-block;
      text-align: left;
      font-size: 13px;
      line-height: 1.7;
      opacity: .9;
    }

    .sectionTitle {
      margin: 8px 0 6px;
      font-size: 15px;
      letter-spacing: .06em;
      opacity: .94;
    }

    .statHeader {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .statIconCanvas {
      display: block;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      margin: 0;
      max-width: none;
      border-radius: 8px;
      background: #120e13;
      border: 1px solid #4a3743;
    }

    .statHeaderTitle {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .canvasWrap {
      width: min(1100px, 96vw);
      margin: 18px auto 30px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #3a2c35;
      border-radius: 12px;
      background: #f6f0e8;
    }

    .canvasWrap canvas {
      margin: 0 auto;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    @media (max-width: 760px) {
      body {
        text-align: left;
      }

      h1 {
        text-align: center;
        font-size: 22px;
        margin: 14px 0 8px;
      }

      .panel {
        width: 100%;
        margin: 0 0 12px;
        padding: 12px;
        border-left: 0;
        border-right: 0;
        border-radius: 0;
      }

      .desc {
        font-size: 12.5px;
        line-height: 1.6;
        text-align: left;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }

      .group {
        width: 100%;
        min-width: 0;
        padding: 12px;
        border-radius: 12px;
      }

      label {
        font-size: 13px;
        margin-top: 8px;
      }

      input[type="text"],
      input[type="number"],
      input[type="color"],
      select,
      textarea,
      input[type="range"] {
        width: 100%;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        font-size: 16px;
        padding: 10px;
      }

      input[type="range"] {
        height: 32px;
      }

      input[type="color"] {
        height: 48px;
      }

      button {
        width: 100%;
        min-height: 46px;
        margin: 0;
        font-size: 15px;
      }

      .statHeader {
        gap: 12px;
      }

      .statIconCanvas {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }

      .legend {
        display: block;
        font-size: 12.5px;
        line-height: 1.65;
      }

      .canvasWrap {
        width: 100vw;
        margin: 10px 0 24px;
        border-left: 0;
        border-right: 0;
        border-radius: 0;
      }

      .canvasWrap canvas {
        width: 760px;
        min-width: 760px;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <h1>異界陣ジェネレーター</h1>

  <div class="panel">
    <div class="desc">
      バフ線とデバフ線は交差する時、お互いに打ち消し合います。<br>
      バフ線/デバフ線が中央核に接続。または線の繋がったバフ線/デバフ線のうちのどれかが中央核に接続した場合に効力を発揮します。
    </div>

    <div class="row">
      <div class="group">
        <label>術式名 / 外周銘</label>
        <input id="spellName" type="text" value="Ars Sigilli" oninput="drawMagicCircle()" />
      </div>

      <div class="group">
        <label>対象名（ラテン語）</label>
        <input id="targetLatin" type="text" value="draco" oninput="drawMagicCircle()" />
      </div>

      <div class="group">
        <label>密度補正（0〜100）</label>
        <input id="density" type="number" min="0" max="100" value="58" oninput="drawMagicCircle()" />
      </div>

      <div class="group">
        <label>追加円周文字（1行ごと）</label>
        <textarea id="extraTexts" oninput="drawMagicCircle()" placeholder="例：&#10;VIA POTESTATIS&#10;NEXUS FORTUNAE&#10;SIGILLUM INTERIUS"></textarea>
      </div>

      <div class="group">
        <label>接続陣の数</label>
        <input id="connectorCount" type="range" min="0" max="8" value="0"
          oninput="syncBasicValue('connectorCount'); renderConnectorInputs(); drawMagicCircle();" />
        <div class="valueRow">接続陣数: <span id="connectorCountValue">0</span></div>
      </div>
    </div>

    <div class="row">
      <div class="group">
        <label>通常線色</label>
        <input id="inkColor" type="color" value="#2a0010" oninput="drawMagicCircle()" />

        <label>淡線色</label>
        <input id="thinColor" type="color" value="#5b2334" oninput="drawMagicCircle()" />

        <label>文字色</label>
        <input id="textColor" type="color" value="#421423" oninput="drawMagicCircle()" />
      </div>

      <div class="group">
        <label>背景色</label>
        <input id="paperColor" type="color" value="#f3eee5" oninput="drawMagicCircle()" />

        <label>核の光</label>
        <input id="coreColor" type="color" value="#fff2dd" oninput="drawMagicCircle()" />

        <label>核の発光</label>
        <input id="glowColor" type="color" value="#ffcfaa" oninput="drawMagicCircle()" />
      </div>

      <div class="group">
        <label>バフ統一色</label>
        <input id="buffColor" type="color" value="#3d8f63" oninput="drawMagicCircle()" />

        <label>デバフ統一色</label>
        <input id="debuffColor" type="color" value="#a03555" oninput="drawMagicCircle()" />
      </div>
    </div>

    <div class="sectionTitle">ステータス副異界陣</div>
    <div class="row" id="statsContainer"></div>

    <div class="sectionTitle">接続陣</div>
    <div class="row" id="connectorContainer"></div>

    <div class="row">
      <button onclick="drawMagicCircle()">生成</button>
      <button onclick="randomizeEffects()">ランダム</button>
      <button onclick="clearEffects()">リセット</button>
      <button onclick="downloadPNG()">PNG保存</button>
      <button onclick="downloadTransparentPNG()">透過PNG保存</button>
    </div>

    <div class="legend">
      <strong>副異界陣対応</strong><br>
      力=三尖紋 / 速度=流線紋 / 防御=同心紋 / 体力=日輪紋 / 異能=蝕紋 / 知力=月紋 / 器用さ=結節紋 / 運=宿星紋 / 魅力=開花紋 / 接続陣=連成環紋<br>
      通常=異界陣に反映しない / バフ=バフ色で出現・バフ線で接続 / デバフ=デバフ色で出現・デバフ線で接続
    </div>
  </div>
  <div class="canvasWrap">
    <canvas id="magicCanvas" width="1100" height="1100"></canvas>
  </div>

  <script>
    const STATS = [
      { id: "power",        label: "力",     symbol: "tridentMark",       angle: 270, defaultDistance: 245, defaultMode: "buff",   defaultAmount: 70 },
      { id: "speed",        label: "速度",   symbol: "flowMark",          angle: 325, defaultDistance: 252, defaultMode: "normal", defaultAmount: 50 },
      { id: "defense",      label: "防御",   symbol: "concentricMark",   angle:  25, defaultDistance: 245, defaultMode: "buff",   defaultAmount: 60 },
      { id: "vitality",     label: "体力",   symbol: "sunRingMark",      angle:  75, defaultDistance: 232, defaultMode: "normal", defaultAmount: 50 },
      { id: "ability",      label: "異能",   symbol: "eclipseMark",      angle: 150, defaultDistance: 245, defaultMode: "buff",   defaultAmount: 80 },
      { id: "intelligence", label: "知力",   symbol: "moonMark",         angle: 210, defaultDistance: 245, defaultMode: "normal", defaultAmount: 50 },
      { id: "dexterity",    label: "器用さ", symbol: "knotMark",         angle: 300, defaultDistance: 236, defaultMode: "normal", defaultAmount: 50 },
      { id: "luck",         label: "運",     symbol: "starMapMark",      angle: 180, defaultDistance: 188, defaultMode: "normal", defaultAmount: 50 },
      { id: "charisma",     label: "魅力",   symbol: "bloomMark",        angle:   0, defaultDistance: 188, defaultMode: "normal", defaultAmount: 50 }
    ];

    const MAX_CONNECTORS = 8;
    let connectorState = Array.from({ length: MAX_CONNECTORS }, (_, i) => ({
      mode: i % 2 === 0 ? "buff" : "debuff",
      angle: (i * 45) % 360,
      distance: 210,
      size: 42
    }));

    const TAU = Math.PI * 2;
    const deg = d => d * Math.PI / 180;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const num = id => Number(document.getElementById(id).value) || 0;
    const val = id => document.getElementById(id).value;

    function renderInputs() {
      const box = document.getElementById("statsContainer");
      box.innerHTML = "";

      STATS.forEach(s => {
        const div = document.createElement("div");
        div.className = "group";
        div.innerHTML = `
          <div class="statHeader">
            <canvas id="${s.id}Icon" class="statIconCanvas" width="76" height="76"></canvas>
            <div class="statHeaderTitle">${s.label}</div>
          </div>

          <label>${s.label}の効果</label>
          <select id="${s.id}Mode" onchange="drawMagicCircle()">
            <option value="normal" ${s.defaultMode === "normal" ? "selected" : ""}>通常</option>
            <option value="buff" ${s.defaultMode === "buff" ? "selected" : ""}>バフ</option>
            <option value="debuff" ${s.defaultMode === "debuff" ? "selected" : ""}>デバフ</option>
          </select>

          <label>${s.label}の効果強度</label>
          <input id="${s.id}Amount" type="range" min="0" max="100" value="${s.defaultAmount}"
            oninput="syncValue('${s.id}Amount'); drawMagicCircle();" />
          <div class="valueRow">強度: <span id="${s.id}AmountValue">${s.defaultAmount}</span></div>

          <label>${s.label}の距離</label>
          <input id="${s.id}Distance" type="range" min="90" max="340" value="${s.defaultDistance}"
            oninput="syncValue('${s.id}Distance'); drawMagicCircle();" />
          <div class="valueRow">距離: <span id="${s.id}DistanceValue">${s.defaultDistance}</span></div>

          <label>${s.label}の方位</label>
          <input id="${s.id}Angle" type="range" min="0" max="359" value="${s.angle}"
            oninput="syncValue('${s.id}Angle'); drawMagicCircle();" />
          <div class="valueRow">方位: <span id="${s.id}AngleValue">${s.angle}</span>°</div>
        `;
        box.appendChild(div);
      });

      drawStatIcons();
    }

    function drawStatIcons() {
      STATS.forEach(s => {
        const canvas = document.getElementById(`${s.id}Icon`);
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#dbc4cf";
        ctx.fillStyle = "#dbc4cf";
        ctx.lineWidth = 3.2;
        ctx.shadowColor = "#dbc4cf";
        ctx.shadowBlur = 4;

        drawSymbol(ctx, s.symbol, canvas.width / 2, canvas.height / 2, 20, -Math.PI / 2, 0.82);
      });
    }

    function renderConnectorInputs() {
      const count = clamp(num("connectorCount"), 0, MAX_CONNECTORS);
      const box = document.getElementById("connectorContainer");
      box.innerHTML = "";

      for (let i = 0; i < count; i++) {
        const c = connectorState[i];
        const div = document.createElement("div");
        div.className = "group";
        div.innerHTML = `
          <label>接続陣 ${i + 1} の種類</label>
          <select id="conn${i}Mode" onchange="updateConnectorValue(${i}, 'mode', this.value)">
            <option value="buff" ${c.mode === "buff" ? "selected" : ""}>バフ陣</option>
            <option value="debuff" ${c.mode === "debuff" ? "selected" : ""}>デバフ陣</option>
          </select>

          <label>接続陣 ${i + 1} の距離</label>
          <input id="conn${i}Distance" type="range" min="90" max="340" value="${c.distance}"
            oninput="updateConnectorValue(${i}, 'distance', this.value)" />
          <div class="valueRow">距離: <span id="conn${i}DistanceValue">${c.distance}</span></div>

          <label>接続陣 ${i + 1} の方位</label>
          <input id="conn${i}Angle" type="range" min="0" max="359" value="${c.angle}"
            oninput="updateConnectorValue(${i}, 'angle', this.value)" />
          <div class="valueRow">方位: <span id="conn${i}AngleValue">${c.angle}</span>°</div>

          <label>接続陣 ${i + 1} のサイズ</label>
          <input id="conn${i}Size" type="range" min="14" max="84" value="${c.size}"
            oninput="updateConnectorValue(${i}, 'size', this.value)" />
          <div class="valueRow">サイズ: <span id="conn${i}SizeValue">${c.size}</span></div>
        `;
        box.appendChild(div);
      }
    }

    function syncBasicValue(id) {
      const el = document.getElementById(id);
      const out = document.getElementById(id + "Value");
      if (el && out) out.textContent = el.value;
    }

    function syncValue(id) {
      const el = document.getElementById(id);
      const out = document.getElementById(id + "Value");
      if (el && out) out.textContent = el.value;
    }

    function syncAllStatValues() {
      STATS.forEach(s => {
        syncValue(s.id + "Amount");
        syncValue(s.id + "Distance");
        syncValue(s.id + "Angle");
      });
      syncBasicValue("connectorCount");
    }

    function updateConnectorValue(index, field, value) {
      connectorState[index][field] = field === "mode" ? value : Number(value);

      if (field !== "mode") {
        const id = `conn${index}${field.charAt(0).toUpperCase() + field.slice(1)}Value`;
        const out = document.getElementById(id);
        if (out) out.textContent = value;
      }

      drawMagicCircle();
    }

    function readColors() {
      return {
        ink: val("inkColor"),
        thin: val("thinColor"),
        text: val("textColor"),
        paper: val("paperColor"),
        core: val("coreColor"),
        glow: val("glowColor"),
        buff: val("buffColor"),
        debuff: val("debuffColor")
      };
    }

    function getStatState(statId, colors) {
      const mode = document.getElementById(statId + "Mode").value;
      const amount = clamp(num(statId + "Amount"), 0, 100);

      if (mode === "buff") return { mode: "buff", amount, accent: colors.buff };
      if (mode === "debuff") return { mode: "debuff", amount, accent: colors.debuff };
      return { mode: "normal", amount: 0, accent: colors.ink };
    }

    function stateDetail(state) {
      if (state.mode === "normal") return 0;
      return 0.005 + Math.pow(state.amount / 100, 1.9) * 0.995;
    }

    function getSatelliteRadius(stat) {
      return clamp(num(stat.id + "Distance"), 90, 340);
    }

    function getSatelliteAngle(stat) {
      return deg(clamp(num(stat.id + "Angle"), 0, 359));
    }

    function getConnectors() {
      const count = clamp(num("connectorCount"), 0, MAX_CONNECTORS);
      return connectorState.slice(0, count);
    }

    function hexToRgba(hex, a) {
      const h = hex.replace("#", "");
      const n = parseInt(h, 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    }

    function noise(seed) {
      const x = Math.sin(seed * 127.173) * 43758.5453123;
      return x - Math.floor(x);
    }

    function line(ctx, x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function circle(ctx, x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.stroke();
    }

    function polygon(ctx, x, y, r, sides, rot = -Math.PI / 2) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const a = rot + TAU * i / sides;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function drawPseudoRunesOnArc(ctx, text, x, y, r, start, end, size = 14, jitter = 0) {
      const base = (text || "ARS SIGILLI OBJECTUM LUX AETERNA VINCULUM CAELI").toUpperCase();
      const phrase = (base + " • ").repeat(8);
      const chars = phrase.split("");
      const span = end - start;
      const count = Math.max(1, Math.floor(Math.abs(span) * r / (size * 0.72)));

      ctx.save();
      ctx.font = `${size}px serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0.5 : i / (count - 1);
        const a = start + span * t + (noise(i + jitter) - 0.5) * 0.01;
        const ch = chars[i % chars.length];

        ctx.save();
        ctx.translate(x + Math.cos(a) * r, y + Math.sin(a) * r);
        ctx.rotate(a + Math.PI / 2);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      }

      ctx.restore();
    }

    function getExtraTextLines() {
      const raw = document.getElementById("extraTexts")?.value || "";
      return raw
        .split(/\n+/)
        .map(s => s.trim())
        .filter(Boolean)
        .slice(0, 6);
    }

    function drawPaper(ctx, w, h, paperColor) {
      ctx.fillStyle = paperColor;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.globalAlpha = 0.09;
      for (let i = 0; i < 5000; i++) {
        const n = noise(i * 9.13);
        ctx.fillStyle = n > 0.5 ? "#000" : "#fff";
        ctx.fillRect(noise(i) * w, noise(i + 33) * h, 1, 1);
      }
      ctx.restore();
    }

    function drawCore(ctx, cx, cy, coreColor, glowColor) {
      ctx.save();

      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 88);
      glow.addColorStop(0, hexToRgba(glowColor, 0.92));
      glow.addColorStop(0.22, hexToRgba(glowColor, 0.42));
      glow.addColorStop(0.72, hexToRgba(glowColor, 0.08));
      glow.addColorStop(1, hexToRgba(glowColor, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, 88, 0, TAU);
      ctx.fill();

      const orb = ctx.createRadialGradient(cx, cy, 0, cx, cy, 38);
      orb.addColorStop(0, "#fff");
      orb.addColorStop(0.18, coreColor);
      orb.addColorStop(0.62, glowColor);
      orb.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = orb;
      ctx.beginPath();
      ctx.arc(cx, cy, 38, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    function drawInscribedHexagram(ctx, cx, cy, r, strokeColor) {
      ctx.save();
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 3.1;

      circle(ctx, cx, cy, r);
      polygon(ctx, cx, cy, r, 3, -Math.PI / 2);
      polygon(ctx, cx, cy, r, 3, Math.PI / 2);

      ctx.restore();
    }

    function drawMainGeometry(ctx, cx, cy, ink, thin, textColor, spell, target, density) {
      const dens = clamp(density, 0, 100) / 100;

      ctx.save();
      ctx.strokeStyle = ink;
      ctx.fillStyle = ink;
      ctx.shadowBlur = 0;

      const rings = [285, 274, 262, 248];

      rings.forEach((r, i) => {
        ctx.lineWidth = i === 0 || i === 2 ? 4.2 : 2.0;
        circle(ctx, cx, cy, r);
      });

      ctx.strokeStyle = thin;
      ctx.fillStyle = textColor;

      const outerTextSize1 = 12.6 - dens * 1.0;
      const outerTextSize2 = 10.6 - dens * 0.9;
      const innerTextSize1 = 9.0 - dens * 0.8;
      const innerTextSize2 = 7.8 - dens * 0.7;

      drawPseudoRunesOnArc(ctx, spell, cx, cy, 268, deg(-172), deg(172), outerTextSize1, 2);
      drawPseudoRunesOnArc(ctx, target ? `AD ${target} OBJECTUM` : spell, cx, cy, 254, deg(18), deg(342), outerTextSize2, 8);

      drawInscribedHexagram(ctx, cx, cy, 248, ink);

      ctx.strokeStyle = thin;
      ctx.lineWidth = 2.0;
      circle(ctx, cx, cy, 200);

      ctx.fillStyle = textColor;
      const extraLines = getExtraTextLines();

      if (extraLines.length > 0) {
        const radii = [214, 182, 158, 116, 96, 76];
        const sizes = [9.8, 9.2, 8.8, 8.0, 7.5, 7.0];

        extraLines.forEach((lineText, i) => {
          const start = i % 2 === 0 ? deg(-160) : deg(24);
          const end = i % 2 === 0 ? deg(160) : deg(336);
          drawPseudoRunesOnArc(ctx, lineText, cx, cy, radii[i], start, end, sizes[i], 90 + i * 19);
        });
      } else {
        drawPseudoRunesOnArc(ctx, "VINCULUM ANIMA LUMEN NOX RATIO FORTUNA", cx, cy, 158, deg(-160), deg(160), innerTextSize1, 90);
        drawPseudoRunesOnArc(ctx, "SIGILLUM CORPUS MENS POTESTAS", cx, cy, 116, deg(24), deg(336), innerTextSize2, 110);
      }

      ctx.restore();
    }

    function drawSymbol(ctx, type, x, y, size, rot = 0, detail = 1) {
      const q = Math.max(0.25, Math.min(1, detail || 1));

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const s = size;
      const oldAlpha = ctx.globalAlpha;

      function strokeAlpha(alpha, fn) {
        ctx.save();
        ctx.globalAlpha = oldAlpha * alpha;
        fn();
        ctx.restore();
      }

      function path(points, closed = false) {
        ctx.beginPath();
        points.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p[0] * s, p[1] * s);
          else ctx.lineTo(p[0] * s, p[1] * s);
        });
        if (closed) ctx.closePath();
        ctx.stroke();
      }

      function ring(r) {
        ctx.beginPath();
        ctx.arc(0, 0, r * s, 0, TAU);
        ctx.stroke();
      }

      function arc(cx, cy, r, a1, a2, ccw = false) {
        ctx.beginPath();
        ctx.arc(cx * s, cy * s, r * s, a1, a2, ccw);
        ctx.stroke();
      }

      function lineLocal(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1 * s, y1 * s);
        ctx.lineTo(x2 * s, y2 * s);
        ctx.stroke();
      }

      function dot(px, py, r = 0.045) {
        ctx.beginPath();
        ctx.arc(px * s, py * s, r * s, 0, TAU);
        ctx.fill();
      }

      function bead(px, py, r = 0.07) {
        ctx.beginPath();
        ctx.arc(px * s, py * s, r * s, 0, TAU);
        ctx.stroke();
      }

      function diamond(px, py, r = 0.10) {
        path([
          [px, py - r],
          [px + r, py],
          [px, py + r],
          [px - r, py]
        ], true);
      }

      function circuitOuterRing() {
        strokeAlpha(0.42, () => {
          ring(1.16);
        });

        strokeAlpha(0.34, () => {
          ring(1.03);
        });
      }

      function threefoldFrame() {
        strokeAlpha(0.48, () => {
          for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.rotate(i * TAU / 3);
            arc(0, -0.33, 0.78, Math.PI * 1.17, Math.PI * 1.83);
            bead(0, -1.10, 0.055);
            ctx.restore();
          }
        });
      }

      function fourfoldFrame() {
        strokeAlpha(0.48, () => {
          for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 2);
            arc(0, 0, 1.12, -Math.PI * 0.17, Math.PI * 0.17);
            bead(0, -1.12, 0.052);
            ctx.restore();
          }
        });
      }

      switch (type) {
        case "tridentMark": { // 三尖紋：槍の絵ではなく、三方向へ裂ける力の紋
          circuitOuterRing();
          threefoldFrame();

          ring(0.26);
          for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.rotate(i * TAU / 3);
            lineLocal(0, -0.18, 0, -1.06);
            path([[0, -1.22], [-0.18, -0.91], [0, -1.01], [0.18, -0.91]], true);
            path([[-0.30, -0.55], [0, -0.72], [0.30, -0.55]]);
            diamond(0, -0.39, 0.055);
            ctx.restore();
          }
          dot(0, 0, 0.05);
          break;
        }

        case "flowMark": { // 流線紋：流れを渦状の軌道として抽象化
          circuitOuterRing();

          strokeAlpha(0.55, () => ring(0.32));

          for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.rotate(i * TAU / 3 + Math.PI * 0.10);
            ctx.beginPath();
            ctx.moveTo(-0.86 * s, -0.12 * s);
            ctx.bezierCurveTo(-0.42 * s, -0.62 * s, 0.32 * s, -0.42 * s, 0.68 * s, -0.03 * s);
            ctx.bezierCurveTo(0.92 * s, 0.24 * s, 0.52 * s, 0.48 * s, 0.24 * s, 0.32 * s);
            ctx.stroke();
            dot(0.73, -0.02, 0.045);
            ctx.restore();
          }

          strokeAlpha(0.45, () => {
            arc(0, 0, 0.78, Math.PI * 0.08, Math.PI * 0.76);
            arc(0, 0, 0.58, Math.PI * 1.06, Math.PI * 1.74);
          });
          break;
        }

        case "concentricMark": { // 同心紋：防壁・封鎖の幾何学紋
          fourfoldFrame();
          ring(1.02);
          ring(0.70);
          ring(0.38);

          path([[0, -1.03], [0.73, 0], [0, 1.03], [-0.73, 0]], true);
          strokeAlpha(0.58, () => {
            path([[0, -0.68], [0.49, 0], [0, 0.68], [-0.49, 0]], true);
          });

          for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 2);
            lineLocal(0, -0.38, 0, -1.28);
            bead(0, -1.38, 0.055);
            ctx.restore();
          }
          dot(0, 0, 0.045);
          break;
        }

        case "sunRingMark": { // 日輪紋：太陽そのものより、生命炉・核の輪
          circuitOuterRing();
          ring(0.84);
          ring(0.52);
          ring(0.22);

          for (let i = 0; i < 12; i++) {
            ctx.save();
            ctx.rotate(i * TAU / 12);
            const longRay = i % 2 === 0;
            lineLocal(0, longRay ? -0.94 : -0.98, 0, longRay ? -1.34 : -1.20);
            if (longRay) diamond(0, -1.43, 0.055);
            ctx.restore();
          }

          strokeAlpha(0.50, () => {
            arc(0, 0, 0.68, Math.PI * 0.06, Math.PI * 0.43);
            arc(0, 0, 0.68, Math.PI * 1.06, Math.PI * 1.43);
          });
          dot(0, 0, 0.07);
          break;
        }

        case "eclipseMark": { // 蝕紋：欠けを直接塗らず、二つの軌道の干渉で表現
          circuitOuterRing();
          ring(0.98);

          strokeAlpha(0.72, () => {
            arc(0.30, 0, 0.82, Math.PI * 0.58, Math.PI * 1.42, true);
            arc(-0.22, 0, 0.52, -Math.PI * 0.55, Math.PI * 0.55, false);
          });

          lineLocal(-1.34, 0, -1.04, 0);
          lineLocal(1.04, 0, 1.34, 0);
          path([[-0.48, -0.62], [0.18, 0], [-0.48, 0.62]]);
          strokeAlpha(0.45, () => ring(0.34));
          dot(0.03, 0, 0.055);
          break;
        }

        case "moonMark": { // 月紋：知性・観測を示す細い測月紋
          circuitOuterRing();

          ctx.beginPath();
          ctx.arc(-0.22 * s, 0, 0.86 * s, Math.PI * 0.26, Math.PI * 1.74, false);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0.30 * s, 0, 0.72 * s, Math.PI * 1.72, Math.PI * 0.28, true);
          ctx.stroke();

          lineLocal(-0.08, -0.72, -0.08, 0.72);
          strokeAlpha(0.50, () => {
            arc(-0.08, 0, 0.42, -Math.PI * 0.5, Math.PI * 0.5);
            ring(0.20);
          });

          bead(-0.84, -0.76, 0.052);
          bead(-0.92, 0.70, 0.052);
          dot(-0.08, 0, 0.045);
          break;
        }

        case "knotMark": { // 結節紋：結び目を単純な花形ではなく、交差する回路にする
          fourfoldFrame();
          ring(0.22);

          for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(0, -0.22 * s);
            ctx.bezierCurveTo(0.48 * s, -0.86 * s, 1.02 * s, -0.36 * s, 0.54 * s, 0.18 * s);
            ctx.bezierCurveTo(0.20 * s, 0.56 * s, -0.22 * s, 0.14 * s, 0, -0.22 * s);
            ctx.stroke();
            bead(0.78, -0.26, 0.046);
            ctx.restore();
          }

          strokeAlpha(0.48, () => {
            path([[-0.62, 0], [0.62, 0]]);
            path([[0, -0.62], [0, 0.62]]);
          });
          dot(0, 0, 0.045);
          break;
        }

        case "starMapMark": { // 宿星紋：星座線・軌道・節点
          circuitOuterRing();

          const pts = [];
          for (let i = 0; i < 7; i++) {
            const a = -Math.PI / 2 + i * TAU / 7;
            const rr = i % 2 === 0 ? 0.84 : 0.52;
            pts.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr });
          }

          ctx.beginPath();
          ctx.moveTo(pts[0].x * s, pts[0].y * s);
          [2, 4, 6, 1, 3, 5, 0].forEach(idx => ctx.lineTo(pts[idx].x * s, pts[idx].y * s));
          ctx.stroke();

          strokeAlpha(0.52, () => {
            arc(0, 0, 0.68, Math.PI * 0.12, Math.PI * 0.88);
            arc(0, 0, 0.96, Math.PI * 1.13, Math.PI * 1.86);
          });

          pts.forEach((p, i) => {
            if (i % 2 === 0) dot(p.x, p.y, 0.052);
            else bead(p.x, p.y, 0.052);
          });
          ring(0.18);
          dot(0, 0, 0.04);
          break;
        }

        case "bloomMark": { // 開花紋：花ではなく、開く結界の六方紋
          circuitOuterRing();
          ring(0.30);

          for (let i = 0; i < 6; i++) {
            ctx.save();
            ctx.rotate(i * TAU / 6);
            ctx.beginPath();
            ctx.moveTo(0, -0.26 * s);
            ctx.bezierCurveTo(0.34 * s, -0.46 * s, 0.42 * s, -0.94 * s, 0, -1.14 * s);
            ctx.bezierCurveTo(-0.42 * s, -0.94 * s, -0.34 * s, -0.46 * s, 0, -0.26 * s);
            ctx.stroke();
            dot(0, -0.82, 0.035);
            ctx.restore();
          }

          strokeAlpha(0.46, () => {
            for (let i = 0; i < 3; i++) {
              ctx.save();
              ctx.rotate(i * TAU / 3 + Math.PI / 6);
              path([[0, -0.34], [0.72, 0.42], [-0.72, 0.42]], true);
              ctx.restore();
            }
          });
          dot(0, 0, 0.055);
          break;
        }

        case "linkedAlchemyMark": { // 連成環紋：三環接続を魔術回路風にする
          circuitOuterRing();

          const p1 = { x: 0, y: -0.62 };
          const p2 = { x: -0.64, y: 0.42 };
          const p3 = { x: 0.64, y: 0.42 };

          [p1, p2, p3].forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x * s, p.y * s, 0.39 * s, 0, TAU);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(p.x * s, p.y * s, 0.20 * s, 0, TAU);
            ctx.stroke();
            dot(p.x, p.y, 0.04);
          });

          path([[p1.x, p1.y + 0.27], [p2.x + 0.24, p2.y - 0.15], [p3.x - 0.24, p3.y - 0.15]], true);
          strokeAlpha(0.52, () => {
            path([[0, -0.22], [-0.36, 0.18], [0, 0.66], [0.36, 0.18]], true);
          });

          ring(0.18);
          dot(0, 0, 0.045);
          break;
        }
      }

      ctx.restore();
    }

    function getStatPoints(cx, cy, colors) {
      return STATS.map((stat, index) => {
        const state = getStatState(stat.id, colors);
        if (state.mode === "normal") return null;

        const a = getSatelliteAngle(stat);
        const r = getSatelliteRadius(stat);

        return {
          kind: "stat",
          stat,
          index,
          state,
          angle: a,
          x: cx + Math.cos(a) * r,
          y: cy + Math.sin(a) * r
        };
      }).filter(Boolean);
    }

    function getConnectorPoints(cx, cy, colors) {
      return getConnectors().map((conn, index) => {
        const mode = conn.mode === "debuff" ? "debuff" : "buff";
        const a = deg(clamp(conn.angle, 0, 359));
        const r = clamp(conn.distance, 90, 340);

        return {
          kind: "connector",
          connector: conn,
          index,
          state: {
            mode,
            amount: 100,
            accent: mode === "buff" ? colors.buff : colors.debuff
          },
          angle: a,
          x: cx + Math.cos(a) * r,
          y: cy + Math.sin(a) * r
        };
      });
    }

    function buildSegments(activePoints, mode, cx, cy) {
      const points = activePoints
        .filter(p => p.state.mode === mode)
        .sort((a, b) => a.angle - b.angle);

      const segments = [];

      points.forEach(p => {
        segments.push({
          type: "radial",
          x1: cx,
          y1: cy,
          x2: p.x,
          y2: p.y
        });
      });

      if (points.length === 2) {
        segments.push({
          type: "group",
          x1: points[0].x,
          y1: points[0].y,
          x2: points[1].x,
          y2: points[1].y
        });
      } else if (points.length >= 3) {
        for (let i = 0; i < points.length; i++) {
          const a = points[i];
          const b = points[(i + 1) % points.length];
          segments.push({
            type: "group",
            x1: a.x,
            y1: a.y,
            x2: b.x,
            y2: b.y
          });
        }
      }

      return { points, segments };
    }

    function segmentIntersection(s1, s2) {
      const x1 = s1.x1, y1 = s1.y1, x2 = s1.x2, y2 = s1.y2;
      const x3 = s2.x1, y3 = s2.y1, x4 = s2.x2, y4 = s2.y2;

      const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
      if (Math.abs(denom) < 1e-9) return null;

      const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
      const u = ((x1 - x3) * (y1 - y2) - (y1 - y3) * (x1 - x2)) / denom;

      if (t <= 0.02 || t >= 0.98 || u <= 0.02 || u >= 0.98) return null;

      return {
        x: x1 + t * (x2 - x1),
        y: y1 + t * (y2 - y1)
      };
    }

    function segmentDistanceToCore(seg, cx, cy) {
      const dx = seg.x2 - seg.x1;
      const dy = seg.y2 - seg.y1;
      const len2 = dx * dx + dy * dy;

      if (len2 === 0) {
        return Math.hypot(cx - seg.x1, cy - seg.y1);
      }

      let t = ((cx - seg.x1) * dx + (cy - seg.y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));

      const px = seg.x1 + t * dx;
      const py = seg.y1 + t * dy;

      return Math.hypot(cx - px, cy - py);
    }

    function collectIntersections(buffSegments, debuffSegments, cx, cy) {
      const intersections = [];

      for (let i = 0; i < buffSegments.length; i++) {
        for (let j = 0; j < debuffSegments.length; j++) {
          const hit = segmentIntersection(buffSegments[i], debuffSegments[j]);
          if (!hit) continue;

          const dx = hit.x - cx;
          const dy = hit.y - cy;

          intersections.push({
            buffIndex: i,
            debuffIndex: j,
            x: hit.x,
            y: hit.y,
            dist2: dx * dx + dy * dy,
            buffCoreDist: segmentDistanceToCore(buffSegments[i], cx, cy),
            debuffCoreDist: segmentDistanceToCore(debuffSegments[j], cx, cy)
          });
        }
      }

      return intersections;
    }

    function removeCrossingSegments(buffSegments, debuffSegments, cx, cy) {
      const intersections = collectIntersections(buffSegments, debuffSegments, cx, cy);

      // 中央核に近い線分を残すため、遠い線分を含む交差から1対1で相殺する
      intersections.sort((a, b) => {
        const aFar = Math.max(a.buffCoreDist, a.debuffCoreDist);
        const bFar = Math.max(b.buffCoreDist, b.debuffCoreDist);
        if (bFar !== aFar) return bFar - aFar;

        const aSum = a.buffCoreDist + a.debuffCoreDist;
        const bSum = b.buffCoreDist + b.debuffCoreDist;
        if (bSum !== aSum) return bSum - aSum;

        return a.dist2 - b.dist2;
      });

      const removeBuff = new Set();
      const removeDebuff = new Set();

      for (const pair of intersections) {
        if (removeBuff.has(pair.buffIndex)) continue;
        if (removeDebuff.has(pair.debuffIndex)) continue;

        removeBuff.add(pair.buffIndex);
        removeDebuff.add(pair.debuffIndex);
      }

      return {
        buff: buffSegments.filter((_, i) => !removeBuff.has(i)),
        debuff: debuffSegments.filter((_, i) => !removeDebuff.has(i))
      };
    }

    function drawSegments(ctx, segments, color) {
      if (!segments.length) return;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      ctx.globalAlpha = 0.72;
      ctx.lineWidth = 3.0;

      segments.forEach(s => {
        line(ctx, s.x1, s.y1, s.x2, s.y2);
      });

      ctx.restore();
    }

    function drawEffectConnections(ctx, cx, cy, activePoints, colors) {
      const buffGroup = buildSegments(activePoints, "buff", cx, cy);
      const debuffGroup = buildSegments(activePoints, "debuff", cx, cy);
      const visible = removeCrossingSegments(
        buffGroup.segments,
        debuffGroup.segments,
        cx,
        cy
      );

      drawSegments(ctx, visible.buff, colors.buff);
      drawSegments(ctx, visible.debuff, colors.debuff);
    }

    function drawSatellite(ctx, cx, cy, stat, index, colors) {
      const state = getStatState(stat.id, colors);
      if (state.mode === "normal") return;

      const detail = stateDetail(state);
      const accent = state.accent;
      const a = getSatelliteAngle(stat);
      const r = getSatelliteRadius(stat);
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;

      const size = 4 + detail * 118;
      const ring = size + 8;

      ctx.save();

      ctx.strokeStyle = colors.ink;
      ctx.fillStyle = colors.ink;
      ctx.shadowColor = colors.glow;
      ctx.shadowBlur = 3;
      ctx.lineWidth = 3.8;
      circle(ctx, x, y, ring);
      ctx.lineWidth = 1.8;
      circle(ctx, x, y, ring - 7);
      circle(ctx, x, y, ring - 14);

      ctx.save();
      ctx.strokeStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 10;
      ctx.globalAlpha = 0.78;
      ctx.lineWidth = 2.6;
      circle(ctx, x, y, ring - 3);
      ctx.restore();

      ctx.fillStyle = colors.text;
      drawPseudoRunesOnArc(
        ctx,
        stat.label + " " + stat.id,
        x, y,
        Math.max(12, ring - 9),
        -Math.PI * 0.88,
        Math.PI * 0.88,
        Math.max(5.5, 6 + detail * 3.2),
        index * 13
      );

      ctx.strokeStyle = accent;
      ctx.fillStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2.8;
      drawSymbol(ctx, stat.symbol, x, y, Math.max(8, size * 0.72), a + Math.PI / 2, detail);

      ctx.restore();
    }

    function drawConnectorCircle(ctx, cx, cy, conn, index, colors) {
      const mode = conn.mode === "debuff" ? "debuff" : "buff";
      const accent = mode === "buff" ? colors.buff : colors.debuff;
      const a = deg(clamp(conn.angle, 0, 359));
      const r = clamp(conn.distance, 90, 340);
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      const size = clamp(conn.size, 14, 84);
      const ring = size + 8;

      ctx.save();

      ctx.strokeStyle = colors.ink;
      ctx.shadowColor = colors.glow;
      ctx.shadowBlur = 4;
      ctx.lineWidth = 3.4;
      circle(ctx, x, y, ring);
      ctx.lineWidth = 1.5;
      circle(ctx, x, y, ring - 7);
      circle(ctx, x, y, ring - 14);

      ctx.save();
      ctx.strokeStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 8;
      ctx.globalAlpha = 0.65;
      ctx.lineWidth = 2.4;
      circle(ctx, x, y, ring - 3);
      ctx.restore();

      ctx.fillStyle = colors.text;
      drawPseudoRunesOnArc(
        ctx,
        `${mode === "buff" ? "AUXILIUM" : "MALEDICTIO"} ${index + 1}`,
        x, y,
        Math.max(12, ring - 9),
        -Math.PI * 0.88,
        Math.PI * 0.88,
        Math.max(5.2, 5.5 + size * 0.03),
        200 + index * 11
      );

      ctx.strokeStyle = accent;
      ctx.fillStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 7;
      ctx.lineWidth = 2.8;
      drawSymbol(ctx, "linkedAlchemyMark", x, y, Math.max(7, size * 0.58), a + Math.PI / 2, 0.9);

      ctx.restore();
    }

    function drawMagicCircle(options = {}) {
      const canvas = document.getElementById("magicCanvas");
      const ctx = canvas.getContext("2d");
      const transparent = options.transparent === true;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const density = clamp(num("density"), 0, 100);
      const colors = readColors();
      const spell = val("spellName") || "Ars Sigilli";
      const target = val("targetLatin").trim();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!transparent) {
        drawPaper(ctx, canvas.width, canvas.height, colors.paper);
      }

      drawCore(ctx, cx, cy, colors.core, colors.glow);
      drawMainGeometry(ctx, cx, cy, colors.ink, colors.thin, colors.text, spell, target, density);

      const statPoints = getStatPoints(cx, cy, colors);
      const connectorPoints = getConnectorPoints(cx, cy, colors);
      const activePoints = [...statPoints, ...connectorPoints];
      drawEffectConnections(ctx, cx, cy, activePoints, colors);

      getConnectors().forEach((c, i) => drawConnectorCircle(ctx, cx, cy, c, i, colors));
      STATS.forEach((s, i) => drawSatellite(ctx, cx, cy, s, i, colors));
    }

    function randomizeEffects() {
      STATS.forEach(s => {
        const roll = Math.random();
        const mode = roll > 0.68 ? "buff" : roll < 0.28 ? "debuff" : "normal";
        const amount = mode === "normal" ? 50 : Math.floor(25 + Math.random() * 75);
        const distance = Math.floor(120 + Math.random() * 210);
        const angle = Math.floor(Math.random() * 360);

        document.getElementById(s.id + "Mode").value = mode;
        document.getElementById(s.id + "Amount").value = amount;
        document.getElementById(s.id + "Distance").value = distance;
        document.getElementById(s.id + "Angle").value = angle;
      });

      const count = Math.floor(Math.random() * 5);
      document.getElementById("connectorCount").value = count;
      syncBasicValue("connectorCount");

      for (let i = 0; i < count; i++) {
        connectorState[i].mode = Math.random() > 0.5 ? "buff" : "debuff";
        connectorState[i].distance = Math.floor(120 + Math.random() * 200);
        connectorState[i].angle = Math.floor(Math.random() * 360);
        connectorState[i].size = Math.floor(20 + Math.random() * 55);
      }

      document.getElementById("density").value = Math.floor(35 + Math.random() * 55);

      renderConnectorInputs();
      syncAllStatValues();
      drawMagicCircle();
    }

    function clearEffects() {
      STATS.forEach(s => {
        document.getElementById(s.id + "Mode").value = "normal";
        document.getElementById(s.id + "Amount").value = s.defaultAmount;
        document.getElementById(s.id + "Distance").value = s.defaultDistance;
        document.getElementById(s.id + "Angle").value = s.angle;
      });

      document.getElementById("connectorCount").value = 0;
      syncBasicValue("connectorCount");

      connectorState = Array.from({ length: MAX_CONNECTORS }, (_, i) => ({
        mode: i % 2 === 0 ? "buff" : "debuff",
        angle: (i * 45) % 360,
        distance: 210,
        size: 42
      }));

      renderConnectorInputs();
      syncAllStatValues();
      drawMagicCircle();
    }

    function safeFileName(base) {
      return (base || "ikai_circle")
        .replaceAll("/", "_")
        .replaceAll("\\", "_")
        .replaceAll(":", "_")
        .replaceAll("*", "_")
        .replaceAll("?", "_")
        .replaceAll("\"", "_")
        .replaceAll("<", "_")
        .replaceAll(">", "_")
        .replaceAll("|", "_")
        .replaceAll(" ", "_");
    }

    function downloadPNG() {
      const canvas = document.getElementById("magicCanvas");
      drawMagicCircle();

      canvas.toBlob(blob => {
        if (!blob) return;

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = safeFileName(val("spellName")) + "_ikai_circle.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, "image/png");
    }

    function downloadTransparentPNG() {
      const canvas = document.getElementById("magicCanvas");

      drawMagicCircle({ transparent: true });

      canvas.toBlob(blob => {
        if (!blob) {
          drawMagicCircle();
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = safeFileName(val("spellName")) + "_ikai_circle_transparent.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        drawMagicCircle();
      }, "image/png");
    }

    function runSelfTests() {
      console.assert(safeFileName('a/b\\c:d*e?f"g<h>i|j k') === 'a_b_c_d_e_f_g_h_i_j_k', 'safeFileName should sanitize reserved characters');

      const crossing = segmentIntersection(
        { x1: 0, y1: 0, x2: 10, y2: 10 },
        { x1: 0, y1: 10, x2: 10, y2: 0 }
      );
      console.assert(crossing && Math.round(crossing.x) === 5 && Math.round(crossing.y) === 5, 'segmentIntersection should detect crossing segments');

      let visible = removeCrossingSegments(
        [{ x1: 0, y1: 0, x2: 10, y2: 10 }],
        [{ x1: 0, y1: 10, x2: 10, y2: 0 }],
        5,
        5
      );
      console.assert(visible.buff.length === 0 && visible.debuff.length === 0, '1 crossing pair should cancel each other');

      visible = removeCrossingSegments(
        [
          { x1: 0, y1: 0, x2: 10, y2: 10 },
          { x1: 20, y1: 20, x2: 30, y2: 30 }
        ],
        [{ x1: 0, y1: 30, x2: 30, y2: 0 }],
        0,
        0
      );
      console.assert(visible.buff.length === 1 && visible.debuff.length === 0, 'protect-near should preserve the segment closer to the core');

      visible = removeCrossingSegments(
        [
          { x1: 0, y1: 0, x2: 10, y2: 10 },
          { x1: 0, y1: 2, x2: 10, y2: 8 },
          { x1: 0, y1: 4, x2: 10, y2: 6 }
        ],
        [{ x1: 0, y1: 10, x2: 10, y2: 0 }],
        5,
        5
      );
      console.assert(visible.buff.length === 2 && visible.debuff.length === 0, '3 buff vs 1 debuff should cancel only one pair');
    }

    renderInputs();
    renderConnectorInputs();
    syncAllStatValues();
    syncBasicValue("connectorCount");
    runSelfTests();
    drawMagicCircle();
  </script>
</body>
</html>
